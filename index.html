<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PIOTR OS — Absolute Brainrot Edition</title>

<style>
:root{
  --accent:#4da3ff;
  --accent2:#8b5cf6;
  --bg:#08111f;
  --panel:#101a2b;
  --panel2:#162338;
  --text:#f5f7ff;
  --muted:#93a4bd;
  --danger:#ff4757;
  --success:#2ed573;
  --warning:#ffa502;
  --shadow:0 20px 60px rgba(0,0,0,.45);
}

*{
  box-sizing:border-box;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Segoe UI,Arial,sans-serif;
  background:#000;
  color:var(--text);
}

button,input,textarea,select{
  font:inherit;
}

button{
  border:0;
  color:white;
  background:#243552;
  padding:9px 13px;
  border-radius:8px;
  cursor:pointer;
  transition:.15s;
}

button:hover{
  background:#315078;
  transform:translateY(-1px);
}

button:active{
  transform:scale(.97);
}

input,textarea,select{
  background:#08111f;
  color:white;
  border:1px solid #31445f;
  border-radius:7px;
  padding:9px;
  outline:none;
}

input:focus,textarea:focus,select:focus{
  border-color:var(--accent);
}

.hidden{
  display:none!important;
}

/* =========================
   BOOT
========================= */

#boot{
  position:fixed;
  inset:0;
  background:#020503;
  color:#48ff72;
  z-index:99999;
  font-family:Consolas,monospace;
  overflow:hidden;
}

.boot-noise{
  position:absolute;
  inset:0;
  opacity:.07;
  background:
    repeating-linear-gradient(
      0deg,
      transparent 0,
      transparent 2px,
      #7aff91 3px
    );
  pointer-events:none;
}

#bootCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:.22;
}

.boot-content{
  position:absolute;
  left:7%;
  top:10%;
  width:86%;
  max-width:1000px;
}

.boot-logo{
  font-size:clamp(28px,6vw,72px);
  font-weight:900;
  letter-spacing:8px;
  text-shadow:0 0 15px #24ff55;
  animation:bootPulse 1.2s infinite alternate;
}

@keyframes bootPulse{
  from{opacity:.7;text-shadow:0 0 8px #24ff55}
  to{opacity:1;text-shadow:0 0 30px #24ff55}
}

.boot-sub{
  color:#80ff99;
  margin:10px 0 30px;
}

.boot-terminal{
  min-height:220px;
  border:1px solid #176c2b;
  background:rgba(0,15,4,.65);
  padding:18px;
  box-shadow:0 0 40px rgba(30,255,80,.12);
  overflow:hidden;
}

.boot-line{
  margin:4px 0;
  opacity:0;
  animation:lineIn .25s forwards;
}

@keyframes lineIn{
  to{opacity:1}
}

.boot-progress-wrap{
  margin-top:25px;
  height:20px;
  border:1px solid #1d8739;
  padding:3px;
}

#bootProgress{
  height:100%;
  width:0%;
  background:#2dff59;
  box-shadow:0 0 20px #2dff59;
  transition:width .15s linear;
}

.boot-status{
  margin-top:12px;
  display:flex;
  justify-content:space-between;
}

#skipBoot{
  margin-top:20px;
  background:transparent;
  border:1px solid #2dff59;
  color:#4cff70;
}

/* =========================
   LOGIN
========================= */

#login{
  position:fixed;
  inset:0;
  z-index:99998;
  background:
    radial-gradient(circle at 50% 30%,#1b365a,#050914 60%);
  display:flex;
  justify-content:center;
  align-items:center;
}

.login-card{
  width:min(420px,90vw);
  padding:35px;
  background:rgba(13,24,42,.88);
  border:1px solid #365071;
  border-radius:20px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(18px);
  text-align:center;
  animation:loginAppear .7s cubic-bezier(.2,1.5,.4,1);
}

@keyframes loginAppear{
  from{
    opacity:0;
    transform:translateY(40px) scale(.85);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  margin:auto;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:48px;
  background:linear-gradient(135deg,#4da3ff,#8b5cf6);
  box-shadow:0 0 40px rgba(77,163,255,.35);
}

.login-card h1{
  margin:15px 0 3px;
}

.login-card p{
  color:var(--muted);
}

#password{
  width:100%;
  margin:15px 0 10px;
}

.login-error{
  color:#ff6675;
  min-height:20px;
}

/* =========================
   OS
========================= */

#os{
  position:fixed;
  inset:0;
  background:#091321;
  overflow:hidden;
}

#desktop{
  position:absolute;
  inset:0 0 52px 0;
  overflow:hidden;
  background:
    radial-gradient(circle at 20% 20%,rgba(77,163,255,.16),transparent 30%),
    radial-gradient(circle at 80% 80%,rgba(139,92,246,.12),transparent 35%),
    linear-gradient(135deg,#07101d,#0d1829 60%,#10182b);
}

#desktop::before{
  content:"";
  position:absolute;
  inset:0;
  opacity:.07;
  background-image:
    linear-gradient(rgba(255,255,255,.3) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.3) 1px,transparent 1px);
  background-size:40px 40px;
  pointer-events:none;
}

.desktop-clock{
  position:absolute;
  right:25px;
  top:18px;
  text-align:right;
  color:#d8e6ff;
  z-index:1;
}

#bigClock{
  font-size:34px;
  font-weight:700;
}

#bigDate{
  color:#8195b2;
}

.desktop-icons{
  position:absolute;
  top:22px;
  left:20px;
  display:grid;
  grid-template-columns:repeat(2,100px);
  gap:15px;
  z-index:2;
}

.desktop-icon{
  width:90px;
  min-height:90px;
  padding:8px;
  border-radius:10px;
  text-align:center;
  cursor:pointer;
  transition:.15s;
}

.desktop-icon:hover{
  background:rgba(255,255,255,.1);
  transform:translateY(-2px);
}

.desktop-icon .ico{
  font-size:38px;
  display:block;
  margin-bottom:4px;
}

.desktop-icon span{
  font-size:12px;
  text-shadow:0 2px 4px black;
}

/* =========================
   TASKBAR
========================= */

#taskbar{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:52px;
  background:rgba(7,13,23,.94);
  border-top:1px solid #263b57;
  display:flex;
  align-items:center;
  padding:6px;
  gap:6px;
  z-index:9000;
  backdrop-filter:blur(15px);
}

#startBtn{
  width:46px;
  height:40px;
  font-size:23px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
}

#taskButtons{
  display:flex;
  gap:4px;
  flex:1;
  overflow:auto;
}

.task-button{
  min-width:100px;
  max-width:180px;
  height:38px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  background:#17263b;
  border:1px solid transparent;
}

.task-button.active{
  border-color:var(--accent);
  background:#223b5a;
}

.tray{
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 10px;
}

.tray-item{
  color:#aabbd1;
  font-size:13px;
}

/* =========================
   START MENU
========================= */

#startMenu{
  position:absolute;
  bottom:58px;
  left:7px;
  width:430px;
  max-width:calc(100vw - 14px);
  max-height:70vh;
  background:rgba(11,20,34,.97);
  border:1px solid #304965;
  border-radius:14px;
  box-shadow:var(--shadow);
  z-index:9500;
  padding:15px;
  animation:menuIn .18s ease-out;
  overflow:auto;
}

@keyframes menuIn{
  from{opacity:0;transform:translateY(15px) scale(.97)}
  to{opacity:1;transform:none}
}

.start-search{
  width:100%;
  margin-bottom:12px;
}

.start-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.start-app{
  padding:12px 5px;
  text-align:center;
  background:#15253a;
  border-radius:9px;
  cursor:pointer;
}

.start-app:hover{
  background:#243b59;
}

.start-app div{
  font-size:25px;
}

.start-app small{
  display:block;
  margin-top:5px;
}

/* =========================
   WINDOWS
========================= */

.window{
  position:absolute;
  min-width:320px;
  min-height:200px;
  width:650px;
  height:450px;
  background:rgba(14,24,40,.97);
  border:1px solid #38516f;
  border-radius:12px;
  box-shadow:0 25px 70px rgba(0,0,0,.55);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  animation:windowOpen .22s cubic-bezier(.2,1.4,.5,1);
}

@keyframes windowOpen{
  from{
    opacity:0;
    transform:translateY(20px) scale(.92);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.window.maximized{
  left:5px!important;
  top:5px!important;
  width:calc(100% - 10px)!important;
  height:calc(100% - 62px)!important;
}

.window-header{
  height:42px;
  display:flex;
  align-items:center;
  padding:0 8px 0 12px;
  background:linear-gradient(90deg,#17283e,#122136);
  border-bottom:1px solid #2a405c;
  cursor:grab;
  flex-shrink:0;
}

.window-header:active{
  cursor:grabbing;
}

.window-title{
  flex:1;
  font-weight:600;
  font-size:14px;
}

.window-controls{
  display:flex;
  gap:4px;
}

.window-controls button{
  width:30px;
  height:28px;
  padding:0;
  background:transparent;
}

.window-controls button:hover{
  background:#2b405a;
}

.window-controls .close:hover{
  background:#b9293b;
}

.window-body{
  flex:1;
  overflow:auto;
  padding:15px;
}

/* =========================
   GENERIC UI
========================= */

.panel{
  background:#111f32;
  border:1px solid #2a405c;
  border-radius:10px;
  padding:13px;
  margin-bottom:10px;
}

.row{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}

.grid2{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
}

.stat{
  background:#0c1828;
  border:1px solid #263b55;
  border-radius:9px;
  padding:12px;
}

.stat b{
  font-size:21px;
}

.muted{
  color:var(--muted);
}

.good{color:var(--success)}
.bad{color:var(--danger)}
.warn{color:var(--warning)}

.progress{
  height:9px;
  background:#07111e;
  border-radius:20px;
  overflow:hidden;
}

.progress>div{
  height:100%;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  width:50%;
  transition:.3s;
}

table{
  width:100%;
  border-collapse:collapse;
}

td,th{
  padding:8px;
  border-bottom:1px solid #263a52;
  text-align:left;
}

.list-item{
  padding:9px;
  border-bottom:1px solid #26384f;
  cursor:pointer;
}

.list-item:hover{
  background:#172b45;
}

/* =========================
   NOTIFICATIONS
========================= */

#notifications{
  position:absolute;
  right:15px;
  bottom:65px;
  width:330px;
  z-index:10000;
  pointer-events:none;
}

.notification{
  background:rgba(12,22,37,.96);
  border:1px solid #365170;
  border-left:4px solid var(--accent);
  border-radius:9px;
  padding:12px;
  margin-top:8px;
  box-shadow:var(--shadow);
  animation:notifIn .25s ease-out;
}

@keyframes notifIn{
  from{opacity:0;transform:translateX(50px)}
  to{opacity:1;transform:none}
}

.notification b{
  display:block;
  margin-bottom:3px;
}

/* =========================
   CONTEXT MENU
========================= */

#contextMenu{
  position:absolute;
  width:210px;
  background:#101c2d;
  border:1px solid #38506b;
  border-radius:9px;
  box-shadow:var(--shadow);
  z-index:20000;
  padding:5px;
}

.context-item{
  padding:9px;
  border-radius:6px;
  cursor:pointer;
}

.context-item:hover{
  background:#213751;
}

/* =========================
   TV
========================= */

.tv{
  display:flex;
  flex-direction:column;
  height:100%;
  gap:10px;
}

.tv-screen{
  position:relative;
  flex:1;
  min-height:250px;
  background:#020306;
  border:8px solid #171717;
  border-radius:12px;
  overflow:hidden;
  box-shadow:inset 0 0 50px black,0 0 30px rgba(0,0,0,.4);
}

#tvCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

.tv-overlay{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.tv-live{
  position:absolute;
  top:12px;
  left:12px;
  background:#e62e43;
  padding:5px 8px;
  border-radius:4px;
  font-weight:bold;
  font-size:12px;
  animation:liveBlink 1s infinite;
}

@keyframes liveBlink{
  50%{opacity:.5}
}

.tv-channel{
  position:absolute;
  top:12px;
  right:12px;
  background:rgba(0,0,0,.7);
  padding:5px 9px;
}

.tv-subtitle{
  position:absolute;
  left:5%;
  right:5%;
  bottom:45px;
  text-align:center;
  font-size:clamp(16px,3vw,28px);
  font-weight:900;
  text-shadow:3px 3px 0 #000,-2px -2px 0 #000;
}

.tv-ticker{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  background:rgba(0,0,0,.85);
  padding:7px;
  white-space:nowrap;
  overflow:hidden;
}

.tv-ticker span{
  display:inline-block;
  animation:ticker 14s linear infinite;
}

@keyframes ticker{
  from{transform:translateX(100%)}
  to{transform:translateX(-120%)}
}

/* =========================
   INTERNET
========================= */

.browser{
  height:100%;
  display:flex;
  flex-direction:column;
}

.browser-bar{
  display:flex;
  gap:5px;
  margin-bottom:8px;
}

.browser-bar input{
  flex:1;
}

.browser-tabs{
  display:flex;
  gap:4px;
  overflow:auto;
  margin-bottom:8px;
}

.browser-tab{
  padding:7px 11px;
  background:#17283e;
  border-radius:7px 7px 0 0;
  cursor:pointer;
  white-space:nowrap;
}

.browser-tab.active{
  background:#263f5e;
}

.browser-page{
  flex:1;
  overflow:auto;
  background:#07101c;
  border:1px solid #2c415a;
  border-radius:8px;
  padding:18px;
}

.net-hero{
  padding:30px;
  border-radius:14px;
  background:
    radial-gradient(circle at 80% 20%,#7c3aed55,transparent 35%),
    radial-gradient(circle at 20% 70%,#0ea5e955,transparent 35%),
    #101c2d;
  text-align:center;
}

.net-logo{
  font-size:42px;
  font-weight:1000;
  letter-spacing:3px;
}

.net-card{
  background:#101e31;
  border:1px solid #2b415d;
  border-radius:10px;
  padding:13px;
  margin-top:10px;
}

.meme-card{
  font-size:22px;
  text-align:center;
  padding:25px;
  background:linear-gradient(135deg,#1e293b,#111827);
  border-radius:12px;
}

.comment{
  padding:8px;
  border-bottom:1px solid #263a52;
}

.ad{
  border:1px dashed #52677f;
  background:#172333;
  padding:12px;
  border-radius:9px;
}

/* =========================
   TERMINAL
========================= */

.terminal{
  height:100%;
  background:#030805;
  color:#58ff79;
  font-family:Consolas,monospace;
  padding:12px;
  overflow:auto;
}

.terminal-output{
  white-space:pre-wrap;
  line-height:1.4;
}

.terminal-input-line{
  display:flex;
  gap:7px;
}

.terminal-input{
  flex:1;
  border:0;
  background:transparent;
  color:#58ff79;
  font-family:inherit;
  padding:3px;
}

/* =========================
   FILE EXPLORER
========================= */

.explorer{
  display:grid;
  grid-template-columns:190px 1fr;
  height:100%;
  gap:10px;
}

.explorer-sidebar{
  background:#0b1727;
  border:1px solid #263d58;
  border-radius:9px;
  padding:8px;
}

.explorer-main{
  overflow:auto;
}

.file-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:8px;
}

.file-card{
  background:#101f32;
  border:1px solid #293f5a;
  border-radius:9px;
  padding:13px;
  cursor:pointer;
  text-align:center;
}

.file-card:hover{
  background:#19304a;
}

.file-card .file-icon{
  font-size:34px;
}

/* =========================
   BRAINROT OVERLAY
========================= */

#realityOverlay{
  position:fixed;
  inset:0;
  z-index:50000;
  pointer-events:none;
  opacity:0;
}

.reality-glitch{
  animation:glitchReality .8s;
}

@keyframes glitchReality{
  0%{opacity:0}
  10%{opacity:.7;background:rgba(255,0,80,.12)}
  20%{opacity:.2;transform:translate(7px,-3px)}
  30%{opacity:.7;background:rgba(0,255,255,.12)}
  45%{transform:translate(-8px,4px)}
  60%{opacity:.5}
  100%{opacity:0;transform:none}
}

/* =========================
   GAME
========================= */

.game-area{
  position:relative;
  height:320px;
  background:#07101c;
  border:1px solid #263d57;
  border-radius:10px;
  overflow:hidden;
}

.duck-target{
  position:absolute;
  font-size:42px;
  cursor:pointer;
  transition:.05s;
}

#snailTrack{
  position:relative;
  height:160px;
  background:#07101c;
  border-radius:10px;
  overflow:hidden;
}

.snail{
  position:absolute;
  font-size:35px;
  left:0;
}

.finish{
  position:absolute;
  right:15px;
  top:0;
  bottom:0;
  border-left:4px dashed white;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:700px){
  .desktop-icons{
    grid-template-columns:repeat(3,80px);
  }

  .desktop-icon{
    width:75px;
  }

  .window{
    min-width:280px;
    width:calc(100% - 10px);
    left:5px!important;
  }

  .grid3{
    grid-template-columns:1fr;
  }

  .grid2{
    grid-template-columns:1fr;
  }

  .explorer{
    grid-template-columns:1fr;
  }

  .explorer-sidebar{
    display:none;
  }

  .start-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .tray-item:nth-child(1),
  .tray-item:nth-child(2){
    display:none;
  }
}
</style>
</head>

<body>

<!-- =========================
     BOOT SCREEN
========================= -->

<div id="boot">
  <canvas id="bootCanvas"></canvas>
  <div class="boot-noise"></div>

  <div class="boot-content">
    <div class="boot-logo">PIOTR OS</div>
    <div class="boot-sub">ABSOLUTE BRAINROT EDITION // KERNEL 5.0</div>

    <div class="boot-terminal" id="bootTerminal"></div>

    <div class="boot-progress-wrap">
      <div id="bootProgress"></div>
    </div>

    <div class="boot-status">
      <span id="bootStatus">INITIALIZING...</span>
      <span id="bootPercent">0%</span>
    </div>

    <button id="skipBoot">POMIŃ ANIMACJĘ BOOTOWANIA</button>
  </div>
</div>

<!-- =========================
     LOGIN
========================= -->

<div id="login" class="hidden">
  <div class="login-card">
    <div class="avatar">🧑‍💻</div>
    <h1>Piotr</h1>
    <p>Administrator systemu</p>

    <input
      id="password"
      type="password"
      placeholder="Hasło"
      autocomplete="off"
    >

    <button id="loginBtn" style="width:100%">
      ZALOGUJ SIĘ
    </button>

    <div id="loginError" class="login-error"></div>

    <small class="muted">
      wskazówka: domyślne hasło to 1234
    </small>
  </div>
</div>

<!-- =========================
     OS
========================= -->

<div id="os" class="hidden">

  <div id="desktop">

    <div class="desktop-icons" id="desktopIcons"></div>

    <div class="desktop-clock">
      <div id="bigClock">00:00:00</div>
      <div id="bigDate">...</div>
    </div>

    <div id="windowLayer"></div>
    <div id="notifications"></div>

    <div id="contextMenu" class="hidden">
      <div class="context-item" data-context="refresh">🔄 Odśwież pulpit</div>

function clone(obj){
  return JSON.parse(JSON.stringify(obj));
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);

    if(!raw){
      const fresh = clone(DEFAULT_STATE);
      fresh.files = defaultFiles();
      return fresh;
    }

    const parsed = JSON.parse(raw);
    const merged = deepMerge(clone(DEFAULT_STATE),parsed);

    if(!merged.files){
      merged.files = defaultFiles();
    }

    return merged;
  }catch(e){
    console.warn("Storage corrupted:",e);
    const fresh = clone(DEFAULT_STATE);
    fresh.files = defaultFiles();
    return fresh;
  }
}

function deepMerge(base, extra){
  Object.keys(extra || {}).forEach(k=>{
    if(
      extra[k] &&
      typeof extra[k] === "object" &&
      !Array.isArray(extra[k]) &&
      base[k] &&
      typeof base[k] === "object" &&
      !Array.isArray(base[k])
    ){
      base[k] = deepMerge(base[k],extra[k]);
    }else{
      base[k] = extra[k];
    }
  });

  return base;
}

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
  }catch(e){
    console.warn("Could not save:",e);
  }
}

function setupBootCanvas(){
  const canvas=document.getElementById("bootCanvas");
  const ctx=canvas.getContext("2d");

  function resize(){
    canvas.width=innerWidth;
    canvas.height=innerHeight;
  }

  resize();
  addEventListener("resize",resize);

  const chars="01PIOTRDUCKBRAINROT";
  const size=16;
  let columns=Math.ceil(innerWidth/size);
  let drops=Array(columns).fill(1);

  function draw(){
    ctx.fillStyle="rgba(0,0,0,.08)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="#36ff68";
    ctx.font=size+"px monospace";

    columns=Math.ceil(canvas.width/size);

    if(drops.length!==columns){
      drops=Array(columns).fill(1);
    }

    for(let i=0;i<drops.length;i++){
      const char=chars[Math.floor(Math.random()*chars.length)];
      ctx.fillText(char,i*size,drops[i]*size);

      if(drops[i]*size>canvas.height && Math.random()>.975){
        drops[i]=0;
      }

      drops[i]++;
    }

    requestAnimationFrame(draw);
  }

  draw();
}

function startBoot(){
  if(bootFinished) return;

  const terminal=document.getElementById("bootTerminal");
  const progress=document.getElementById("bootProgress");
  const percent=document.getElementById("bootPercent");
  const status=document.getElementById("bootStatus");
  const skip=document.getElementById("skipBoot");

  const lines=[
    "[ OK ] Initializing PIOTR kernel...",
    "[ OK ] Loading Duck Management Subsystem...",
    "[ OK ] Checking potato integrity...",
    "[ OK ] Mounting C:/...",
    "[ OK ] Starting PiotrNet...",
    "[ OK ] Loading brainrot drivers...",
    "[ OK ] Searching for suspicious.exe...",
    "[WARN] suspicious.exe refuses to cooperate.",
    "[ OK ] Starting Reality Engine...",
    "[ OK ] Loading user profile...",
    "[ OK ] Counting previous mistakes...",
    "[ OK ] System is approximately stable."
  ];

  let index=0;
  let pct=0;

  function finish(){
    if(bootFinished) return;

    bootFinished=true;

    if(bootInterval){
      clearInterval(bootInterval);
      bootInterval=null;
    }

    progress.style.width="100%";
    percent.textContent="100%";
    status.textContent="SYSTEM READY";

    setTimeout(showLogin,350);
  }

  skip.onclick=finish;

  bootInterval=setInterval(()=>{
    if(index<lines.length){
      const line=document.createElement("div");
      line.className="boot-line";
      line.textContent=lines[index++];
      terminal.appendChild(line);
      terminal.scrollTop=terminal.scrollHeight;
    }

    pct+=Math.floor(Math.random()*8)+5;

    if(pct>=100){
      pct=100;
      progress.style.width=pct+"%";
      percent.textContent=pct+"%";
      status.textContent="READY";
      setTimeout(finish,450);
      return;
    }

    progress.style.width=pct+"%";
    percent.textContent=pct+"%";

    const statuses=[
      "Loading kernel...",
      "Mounting duck subsystem...",
      "Negotiating with PiotrBot...",
      "Generating reality...",
      "Pretending to optimize...",
      "Almost definitely working..."
    ];

    status.textContent=statuses[Math.floor(Math.random()*statuses.length)];
  },380);
}

function createWindow(title,icon,content,width=650,height=450){
  const id="window_"+(++windowCounter);

  const win=document.createElement("div");
  win.className="window";
  win.id=id;

  win.style.width=Math.min(width,innerWidth-10)+"px";
  win.style.height=Math.min(height,innerHeight-65)+"px";

  const offset=(windowCounter*25)%180;

  win.style.left=(70+offset)+"px";
  win.style.top=(45+offset)+"px";
  win.style.zIndex=++zIndex;

  win.innerHTML=`
    <div class="window-header">
      <div class="window-title">${icon} ${escapeHTML(title)}</div>

      <div class="window-controls">
        <button data-action="min">−</button>
        <button data-action="max">□</button>
        <button data-action="close" class="close">×</button>
      </div>
    </div>

    <div class="window-body">${content}</div>
  `;

  document.getElementById("windowLayer").appendChild(win);

  windows.set(id,{
    id,
    title,
    icon,
    minimized:false,
    maximized:false
  });

  const header=win.querySelector(".window-header");

  win.addEventListener("mousedown",()=>{
    focusWindow(win);
  });

  win.querySelector("[data-action='close']").onclick=e=>{
    e.stopPropagation();
    closeWindow(id);
  };

  win.querySelector("[data-action='min']").onclick=e=>{
    e.stopPropagation();
    minimizeWindow(id);
  };

  win.querySelector("[data-action='max']").onclick=e=>{
    e.stopPropagation();
    maximizeWindow(id);
  };

  makeDraggable(win,header);

  focusWindow(win);
  updateTaskbar();

  return win;
}

function focusWindow(win){
  win.style.zIndex=++zIndex;

  document.querySelectorAll(".task-button").forEach(btn=>{
    btn.classList.toggle("active",btn.dataset.window===win.id);
  });
}

function closeWindow(id){
  const win=document.getElementById(id);

  if(!win) return;

  win.remove();
  windows.delete(id);

  updateTaskbar();
}

function minimizeWindow(id){
  const win=document.getElementById(id);
  if(!win) return;

  win.classList.add("hidden");

  const data=windows.get(id);
  if(data) data.minimized=true;

  updateTaskbar();
}

function maximizeWindow(id){
  const win=document.getElementById(id);
  const data=windows.get(id);

  if(!win || !data) return;

  data.maximized=!data.maximized;
  win.classList.toggle("maximized",data.maximized);

  focusWindow(win);
}

function makeDraggable(win,header){
  let dragging=false;
  let offsetX=0;
  let offsetY=0;

  header.addEventListener("mousedown",e=>{
    if(e.target.closest("button")) return;

    if(win.classList.contains("maximized")) return;

    dragging=true;

    const rect=win.getBoundingClientRect();

    offsetX=e.clientX-rect.left;
    offsetY=e.clientY-rect.top;

    focusWindow(win);
  });

  document.addEventListener("mousemove",e=>{
    if(!dragging) return;

    const maxX=innerWidth-win.offsetWidth;
    const maxY=innerHeight-65-win.offsetHeight;

    win.style.left=Math.max(0,Math.min(maxX,e.clientX-offsetX))+"px";
    win.style.top=Math.max(0,Math.min(maxY,e.clientY-offsetY))+"px";
  });

  document.addEventListener("mouseup",()=>{
    dragging=false;
  });
}

function updateTaskbar(){
  const bar=document.getElementById("taskButtons");
  bar.innerHTML="";

  windows.forEach(data=>{
    const btn=document.createElement("button");
    btn.className="task-button";
    btn.dataset.window=data.id;
    btn.textContent=data.icon+" "+data.title;

    btn.onclick=()=>{
      const win=document.getElementById(data.id);

      if(!win) return;

      if(data.minimized){
        win.classList.remove("hidden");
        data.minimized=false;
        focusWindow(win);
      }else{
        focusWindow(win);
      }

      updateTaskbar();
    };

    bar.appendChild(btn);
  });
}

function escapeHTML(str){

    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")

}

function getFile(id){
  return state.files.find(f=>f.id===id);
}

function getChildren(parent){
  return state.files.filter(f=>f.parent===parent && (!f.hidden || state.unlocked.secretFolder));
}

function renderExplorer(){
  const grid=document.getElementById("fileGrid");
  const path=document.getElementById("filePath");

  if(!grid) return;

  const folder=getFile(currentFolder);

  path.textContent="📍 "+(folder?.name||"C:");

  grid.innerHTML="";

  getChildren(currentFolder).forEach(file=>{
    const card=document.createElement("div");
    card.className="file-card";

    const icon=file.type==="folder"?"📁":file.executable?"⚙️":"📄";

    card.innerHTML=`
      <div class="file-icon">${icon}</div>
      <div>${escapeHTML(file.name)}</div>
      <small class="muted">${file.type}</small>
    `;

    card.ondblclick=()=>{
      if(file.type==="folder"){
        currentFolder=file.id;
        renderExplorer();
      }else{
        openFile(file);
      }
    };

    card.onclick=()=>{
      if(file.dangerous){
        notify("unknown.exe","Nie patrz tak na mnie.");
      }
    };

    grid.appendChild(card);
  });
}

function explorerGo(id){
  if(getFile(id)){
    currentFolder=id;
    renderExplorer();
  }
}

function explorerUp(){
  const current=getFile(currentFolder);

  if(current?.parent){
    currentFolder=current.parent;
    renderExplorer();
  }
}

function calcPress(v){
  const display=document.getElementById("calcDisplay");

  if(!display) return;

  if(v==="C"){
    display.value="";
    return;
  }

  if(v==="="){
    try{
      if(!/^[0-9+\-*/().% ]+$/.test(display.value)){
        throw new Error();
      }

      display.value=String(Function(
        '"use strict";return ('+display.value+')'
      )());

    }catch(e){
      display.value="ERROR";
    }

    return;
  }

  display.value+=v;
}

function generateProcessList(){
  const processes=[
    "System",
    "explorer.exe",
    "piotr.exe",
    "PiotrBot.exe",
    "duck.exe",
    "svchost_potato.exe",
    "unknown.exe",
    "reality.exe"
  ];

  return processes.map((p,i)=>
    `${String(100+i).padEnd(5)} ${p.padEnd(25)} CPU ${randomCPU()}%`
  ).join("\n");
}

function randomCPU(){
  return Math.floor(Math.random()*15+2);
}

function makeFileTree(id,depth){
  const file=getFile(id);
  if(!file) return "";

  let result=" ".repeat(depth*2)+"└─ "+file.name+"\n";

  if(file.type==="folder"){
    getChildren(id).forEach(child=>{
      result+=makeFileTree(child.id,depth+1);
    });
  }

  return result;
}

function killProcess(name,output){
  if(!name){
    terminalPrint(output,"kill <proces>");
    return;
  }

  if(name==="unknown.exe"){
    terminalPrint(output,"unknown.exe: NIE.");
    increaseChaos(12);
    spawnGhost();
    return;
  }

  terminalPrint(output,name+" zakończony. Prawdopodobnie.");
  increaseChaos(3);
}

function browserSearch(query){
  query=query.trim();

  if(!query) return;

  state.stats.searches++;
  state.browserHistory.push(query);

  const q=query.toLowerCase();

  let page;

  if(q.includes("brain") || q.includes("meme")){
    page="brainrot";
  }else if(q.includes("forum")){
    page="forum";
  }else if(q.includes("social")){
    page="social";
  }else if(q.includes("stock") || q.includes("gieł")){
    page="market";
  }else if(q.includes("news") || q.includes("wiad")){
    page="news";
  }else if(q.includes("ufo")){
    page="ufo";
  }else if(q.includes("kacz")){
    page="duck";
  }else if(q.includes("ziem") || q.includes("potat")){
    page="potato";
  }else if(q.includes("ai") || q.includes("bot")){
    page="ai";
  }else if(q.includes("sekret")){
    page="secret";
  }else if(q==="nic"){
    page="404";
  }else{
    page=q;
  }

  const tab=browserTabs.find(t=>t.id===activeBrowserTab);

  if(tab){
    tab.url=page;
    tab.title=query.slice(0,20);
  }

  renderBrowser();
  increaseChaos(1);
  saveState();
}

function startTV(){
  stopTV();

  const canvas=document.getElementById("tvCanvas");

  if(!canvas) return;

  const ctx=canvas.getContext("2d");

  function resize(){
    const rect=canvas.getBoundingClientRect();
    canvas.width=Math.max(300,rect.width);
    canvas.height=Math.max(200,rect.height);
  }

  resize();

  const channel=TV_CHANNELS[state.tvChannel];

  document.getElementById("tvChannelName").textContent=
    channel.name;

  tvStart=Date.now();

  function frame(){
    if(!document.getElementById("tvCanvas")) return;

    if(!state.tvPaused){
      tvFrame++;

      drawTV(ctx,canvas.width,canvas.height,channel);

      const subtitle=getTVSubtitle(channel.type);

      const sub=document.getElementById("tvSubtitle");
      const ticker=document.getElementById("tvTicker");
      const info=document.getElementById("tvProgramInfo");

      if(sub) sub.textContent=subtitle;

      if(ticker){
        ticker.textContent=
          "BREAKING: "+generateNews()[0].title+
          "   •   PIOTR OS LIVE   •   KACZKA MA INFORMACJE   •   ";
      }

      if(info){
        info.textContent=
          " "+channel.name+
          " • LIVE • "+Math.floor((Date.now()-tvStart)/1000)+"s";
      }
    }

    tvAnimation=requestAnimationFrame(frame);
  }

  frame();
}

function stopTV(){
  if(tvAnimation){
    cancelAnimationFrame(tvAnimation);
    tvAnimation=null;
  }
}

function drawTV(ctx,w,h,channel){
  const t=tvFrame;

  ctx.fillStyle="#030509";
  ctx.fillRect(0,0,w,h);

  if(channel.type==="brainrot"){
    drawBrainrot(ctx,w,h,t);
  }

  if(channel.type==="duck"){
    drawDuckNews(ctx,w,h,t);
  }

  if(channel.type==="potato"){
    drawPotatoTV(ctx,w,h,t);
  }

  if(channel.type==="npc"){
    drawNPC(ctx,w,h,t);
  }

  if(channel.type==="sport"){
    drawSport(ctx,w,h,t);
  }

  if(channel.type==="nothing"){
    ctx.fillStyle="#111";
    ctx.fillRect(0,0,w,h);

    ctx.fillStyle="#777";
    ctx.font="bold 40px Arial";
    ctx.textAlign="center";
    ctx.fillText("NIC",w/2,h/2);

    ctx.font="16px Arial";
    ctx.fillText("Najbardziej ekskluzywny kanał",w/2,h/2+35);
  }

  /* scanlines */
  ctx.fillStyle="rgba(255,255,255,.035)";

  for(let y=0;y<h;y+=4){
    ctx.fillRect(0,y,w,1);
  }
}

function drawBrainrot(ctx,w,h,t){
  const colors=[
    "#ff006e",
    "#00f5d4",
    "#fee440",
    "#8338ec",
    "#3a86ff"
  ];

  for(let i=0;i<14;i++){
    const x=w/2+
      Math.sin(t*.03+i)*w*.38;

    const y=h/2+
      Math.cos(t*.025+i*1.7)*h*.32;

    const r=15+
      Math.abs(Math.sin(t*.04+i))*45;

    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle=colors[i%colors.length];
    ctx.globalAlpha=.75;
    ctx.fill();
  }

  ctx.globalAlpha=1;

  ctx.fillStyle="#fff";
  ctx.font="900 "+Math.min(55,w/10)+"px Arial";
  ctx.textAlign="center";

  const words=[
    "SKIBIDI",
    "KACZKA",
    "PIOTR",
    "BRAINROT",
    "KWA",
    "ZIEMNIAK"
  ];

  ctx.fillText(
    words[Math.floor(t/35)%words.length],
    w/2,
    h/2
  );

  ctx.font="bold 18px Arial";
  ctx.fillText(
    "NIE MA KONTEKSTU",
    w/2,
    h/2+45
  );
}

  ctx.font=Math.min(110,w*.25)+"px Arial";

}

function applyTheme(theme){
  const root=document.documentElement;

  const themes={
    blue:{
      accent:"#4da3ff",
      accent2:"#8b5cf6"
    },
    dark:{
      accent:"#64748b",
      accent2:"#334155"
    },
    purple:{
      accent:"#c084fc",
      accent2:"#7c3aed"
    },
    green:{
      accent:"#34d399",
      accent2:"#16a34a"
    }
  };

  const t=themes[theme]||themes.blue;

  root.style.setProperty("--accent",t.accent);
  root.style.setProperty("--accent2",t.accent2);
}

function setTheme(theme){
  state.theme=theme;
  applyTheme(theme);
  saveState();

  notify("Ustawienia","Motyw zmieniony.");
}

function resetGame(){
  if(!confirm("Naprawdę usunąć zapis Piotr OS?")) return;

  localStorage.removeItem(STORAGE_KEY);

}

function exportState(){
  const blob=new Blob(
    [JSON.stringify(state,null,2)],
    {type:"application/json"}
  );

  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");

  a.href=url;
  a.download="piotr-os-save.json";
  a.click();

  URL.revokeObjectURL(url);
}

function getBotGreeting(){
  if(state.chaos>70){
    return "Witaj. Nie wiem, dlaczego system jeszcze działa.";
  }

  if(state.sessions>3){
    return "Znowu Ty. Pamiętam poprzednie sesje.";
  }

  return "Cześć Piotr. Jestem PiotrBot. Mam kilka pytań dotyczących Twoich decyzji.";
}

function addBotMessage(chat,who,text){
  const div=document.createElement("div");

  div.style.padding="9px";
  div.style.marginBottom="6px";
  div.style.background=who==="bot"?"#162941":"#1b3049";
  div.style.borderRadius="8px";

  div.innerHTML=`
    <b>${who==="bot"?"🤖 PiotrBot":"🧑 Ty"}</b>
    <div>${escapeHTML(text)}</div>
  `;

  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
}

function sendBotMessage(){
  const input=document.getElementById("botInput");
  const chat=document.getElementById("botChat");

  if(!input || !chat) return;

  const text=input.value.trim();

  if(!text) return;

  addBotMessage(chat,"user",text);

  state.botMemory.push(text);

  if(state.botMemory.length>30){
    state.botMemory.shift();
  }

  input.value="";

  setTimeout(()=>{
    addBotMessage(
      chat,
      "bot",
      botResponse(text)
    );
  },350);

  state.reputation.bot++;
  saveState();
}

function botResponse(text){
  const q=text.toLowerCase();

  if(q.includes("kacz")){
    return "Kaczka ma obecnie wyższy autorytet niż ja. To mnie boli.";
  }

  if(q.includes("piotr")){
    return "Piotr jest administratorem. Chyba. Dokumentacja jest niejasna.";
  }

  if(q.includes("internet")){
    return "PiotrNet nie jest prawdziwym internetem. Ale zachowuje się jak prawdziwy internet.";
  }

  if(q.includes("chaos")){
    return "Aktualny chaos wynosi "+state.chaos+"%. Proponuję niczego nie dotykać. Czyli pewnie dotkniesz.";
  }

  if(q.includes("kim jesteś") || q.includes("kto jesteś")){
    return "Jestem PiotrBot. Mam osobowość, ale nie mam wynagrodzenia.";
  }

  const answers=[
    "To brzmi podejrzanie.",
    "Nie mam na to procedury.",
    "System zaleca, żebyś otworzył Internet.",
    "Ciekawa decyzja. Zapisuję ją.",
    "Nie wiem. Zapytaj kaczkę.",
    "Odpowiedź brzmi: ziemniak.",
    "Proszę nie komplikować sytuacji.",
    "Właśnie zwiększyłeś moje zaufanie o 0.7 punktu.",
    "Nie powinieneś był tego pytać."
  ];

  return answers[
    Math.floor(Math.random()*answers.length)
  ];
}

function drawRadar(){
  const canvas=document.getElementById("radarCanvas");

  if(!canvas) return;

  const ctx=canvas.getContext("2d");
  const w=canvas.width;
  const h=canvas.height;
  const r=Math.min(w,h)/2-10;

  ctx.clearRect(0,0,w,h);

  ctx.strokeStyle="#2dff9a";
  ctx.lineWidth=2;

  ctx.beginPath();
  ctx.arc(w/2,h/2,r,0,Math.PI*2);
  ctx.stroke();

  for(let i=1;i<=3;i++){
    ctx.beginPath();
    ctx.arc(w/2,h/2,r*i/3,0,Math.PI*2);
    ctx.stroke();
  }

  ctx.beginPath();
  ctx.moveTo(w/2-r,h/2);
  ctx.lineTo(w/2+r,h/2);
  ctx.moveTo(w/2,h/2-r);
  ctx.lineTo(w/2,h/2+r);
  ctx.stroke();

  ctx.fillStyle="#49ff8a";

  for(let i=0;i<6;i++){
    const a=Math.random()*Math.PI*2;
    const rr=Math.random()*r;

    ctx.beginPath();
    ctx.arc(
      w/2+Math.cos(a)*rr,
      h/2+Math.sin(a)*rr,
      3,
      0,
      Math.PI*2
    );
    ctx.fill();
  }
}

    },
    {
      title:"PiotrNet działa",
      text:"To najbardziej niepokojąca wiadomość dnia."
    }
  ];

  return [
    news[Math.floor(Math.random()*news.length)],
    news[Math.floor(Math.random()*news.length)],
    news[Math.floor(Math.random()*news.length)]
  ];
}

/* ============================================================
   PASSIVE SYSTEM
============================================================ */

function passiveSystems(){
  if(!systemRunning) return;

  state.clicks++;

  /* bank interest */
  if(state.bank>0){
    state.bank+=Math.round(state.bank*.001*100)/100;
  }

  /* debt */
  if(state.debt>0){
    state.debt+=Math.round(state.debt*.002*100)/100;
  }

  /* passive chaos */
  if(Math.random()<.25){
    state.chaos=Math.max(
      0,
      Math.min(100,state.chaos+(Math.random()-.45)*2)
    );
  }

  updateChaosUI();
  updateTray();

  if(state.clicks%60===0){
    saveState();
  }
}

function randomEvent(){
  if(!systemRunning || !state.settings.randomEvents) return;

  const events=[
    ()=>{
      notify(
        "Losowe wydarzenie",
        "Kaczka przeszła przez System32."
      );
      spawnDuck();
    },
    ()=>{
      notify(
        "Losowe wydarzenie",
        "PiotrBot właśnie o Tobie pomyślał."
      );
    },
    ()=>{
      notify(
        "Losowe wydarzenie",
        "Znaleziono ₱7 na pulpicie."
      );
      state.money+=7;
      updateTray();
    },
    ()=>{
      notify(
        "Losowe wydarzenie",
        "System usłyszał podejrzane 'KWA'."
      );
      increaseChaos(3);
    },
    ()=>{
      spawnSnail();
      notify(
        "Losowe wydarzenie",
        "Ślimak odwiedził Twój pulpit."
      );
    },
    ()=>{
      if(Math.random()>.5){
        spawnGhost();
      }
    }
  ];

  events[
    Math.floor(Math.random()*events.length)
  ]();
}

/* ============================================================
   TRAY
============================================================ */

function updateTray(){
  updateChaosUI();

  const money=document.getElementById("moneyTray");

  if(money){
    money.textContent="₱ "+Math.floor(state.money);
  }
}

/* ============================================================
   EASTER EGGS
============================================================ */

let lastDesktopClick=0;

document.addEventListener("dblclick",e=>{
  if(
    e.target===document.getElementById("desktop")
  ){
    const now=Date.now();

    if(now-lastDesktopClick<500){
      openPortal();
    }

    lastDesktopClick=now;
  }
});

/* ============================================================
   SAVE
============================================================ */

window.addEventListener("beforeunload",()=>{
  saveState();
});

/* ============================================================
   START
============================================================ */

document.addEventListener("DOMContentLoaded",init);

/* ============================================================
   GLOBAL ERROR HANDLER
   Jeżeli jakiś pojedynczy brainrot się wywali,
   system nie powinien umrzeć.
============================================================ */

window.addEventListener("error",e=>{
  console.warn("Piotr OS caught an error:",e.error);

  if(systemRunning){
    notify(
      "Piotr OS",
      "Wykryto drobny błąd. System udaje, że nic się nie stało."
    );
  }
});

/* ============================================================
   FINAL INITIALIZATION
============================================================ */

applyTheme(state.theme);
updateChaosUI();
updateTray();

</script>
